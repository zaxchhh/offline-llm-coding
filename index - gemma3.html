<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird Clone</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #222; font-family: 'Arial', sans-serif; overflow: hidden; }
        #gameContainer { width: 400px; height: 600px; background-color: #70c5ce; position: relative; overflow: hidden; border: 4px solid #333; }
        /* Bird styling */
        #bird { width: 40px; height: 30px; background-color: #ffeb3b; position: absolute; left: 50px; border-radius: 5px; border: 2px solid #8a6d3b; z-index: 10; transition: transform 0.1s; }
        .pipe { position: absolute; width: 60px; background-color: #74bf2e; border: 3px solid #38761d; box-sizing: border-box; }
        #scoreBoard { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 40px; font-weight: bold; color: #fff; z-index: 100; text-shadow: 2px 2px #000; }
        #gameOverScreen { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 20px; border-radius: 10px; text-align: center; z-index: 200; }
        button { background: #ffeb3b; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="scoreBoard">0</div>
        <div id="bird"></div>
        <div id="gameOverScreen">
            <h2>GAME OVER</h2>
            <p id="finalScore"></p>
            <button onclick="startGame()">Try Again</button>
        </div>
    </div>

    <script>
        const bird = document.getElementById('bird');
        const scoreBoard = document.getElementById('scoreBoard');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const container = document.getElementById('gameContainer');

        let birdY = 300, velocity = 0, score = 0, isPlaying = false, pipes = [];
        const GRAVITY = 0.4, JUMP = -6.5, PIPE_GAP = 160;

        document.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });
        container.addEventListener('click', jump);

        function jump() {
            if (!isPlaying) return;
            velocity = JUMP;
        }

        function startGame() {
            isPlaying = true;
            birdY = 300; velocity = 0; score = 0;
            pipes.forEach(p => { p.top.remove(); p.bottom.remove(); });
            pipes = [];
            gameOverScreen.style.display = 'none';
            scoreBoard.innerText = '0';
            requestAnimationFrame(loop);
        }

        function loop() {
            if (!isPlaying) return;
            
            // Physics
            velocity += GRAVITY;
            birdY += velocity;
            bird.style.top = birdY + 'px';
            bird.style.transform = `rotate(${velocity * 3}deg)`;

            // Floor/Ceiling collision
            if (birdY > 570 || birdY < 0) return endGame();

            // Pipe spawning
            if (Math.random() < 0.02) createPipe();

            pipes.forEach((p, i) => {
                p.x -= 3;
                p.top.style.left = p.x + 'px';
                p.bottom.style.left = p.x + 'px';

                // Scoring
                if (p.x === 50) { score++; scoreBoard.innerText = score; }

                // Improved Collision
                if (p.x < 90 && p.x > 0 && (birdY < p.topHeight || birdY > p.topHeight + PIPE_GAP - 30)) return endGame();
                
                if (p.x < -60) { p.top.remove(); p.bottom.remove(); pipes.splice(i, 1); }
            });
            requestAnimationFrame(loop);
        }

        function createPipe() {
            let h = Math.random() * (500 - PIPE_GAP - 100) + 50;
            let top = document.createElement('div');
            top.className = 'pipe'; top.style.height = h + 'px'; top.style.top = '0px'; top.style.left = '400px';
            let bot = document.createElement('div');
            bot.className = 'pipe'; bot.style.height = (600 - h - PIPE_GAP) + 'px'; bot.style.bottom = '0px'; bot.style.left = '400px';
            container.appendChild(top); container.appendChild(bot);
            pipes.push({ top, bottom: bot, x: 400, topHeight: h });
        }

        function endGame() {
            isPlaying = false;
            document.getElementById('finalScore').innerText = 'Score: ' + score;
            gameOverScreen.style.display = 'block';
        }
        
        // Start game on first click
        container.addEventListener('click', () => { if(!isPlaying && gameOverScreen.style.display !== 'block') startGame(); }, {once: true});
    </script>
</body>
</html>
